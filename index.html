<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Vitrine « aquarium » des cristaux — Les Veilleurs</title>
<link rel="stylesheet" href="lv.css">
</head>
<body>
<div id="gate"></div>
<div id="topbar"></div>
<header id="hdr"></header>
<nav id="nav"></nav>
<main>
  <section id="contexte"></section>
  <section id="principe"></section>
  <section id="dimensions"></section>
  <section id="montage"></section>
  <section id="fournitures"></section>
  <section id="ouverts"></section>
  <section id="documents"></section>
  <section id="cao"></section>
  <section id="journal"></section>
</main>
<footer id="foot"></footer>
<script src="docs/sizes.js"></script>
<script src="data.js"></script>
<script src="lv.js"></script>
<script>
LV.init(window.DATA, "aquarium", ({t, esc}) => {
  const D = window.DATA, $ = s => document.querySelector(s);
  const img = (src, alt) => `<a href="${esc(src)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="${esc(alt||"")}" loading="lazy"></a>`;

  $("#contexte").innerHTML = `<h2>${esc(t(D.contexte.titre))}</h2><p>${esc(t(D.contexte.texte))}</p>
    <div class="vues">${D.contexte.vues.map(v => `<div class="vue">${img(v.src, t(v.legende))}<div class="body"><p>${esc(t(v.legende))}</p></div></div>`).join("")}</div>`;

  $("#principe").innerHTML = `<h2>${esc(t(D.principe.titre))}</h2>` + D.principe.items.map(p => `<h3>${esc(t(p.t))}</h3><p>${esc(t(p.d))}</p>${p.img ? img(p.img, t(p.t)) : ""}`).join("");

  const dm = D.dimensions;
  $("#dimensions").innerHTML = `<h2>${esc(t(dm.titre))}</h2><div class="scroll"><table><tr>${dm.colonnes.map(c => `<th>${esc(t(c))}</th>`).join("")}</tr>${dm.lignes.map(l => `<tr>${l.map(c => `<td>${esc(t(c))}</td>`).join("")}</tr>`).join("")}</table></div><p class="leg">${esc(t(dm.note))}</p>`;

  const m = D.montage;
  $("#montage").innerHTML = `<h2>${esc(t(m.titre))}</h2>${img(m.img, t(m.titre))}<div class="scroll"><table><tr><th>#</th>${m.colonnes.map(c => `<th>${esc(t(c))}</th>`).join("")}</tr>${m.etapes.map((e, i) => `<tr><td>${i + 1}</td>${e.map(c => `<td>${esc(t(c))}</td>`).join("")}</tr>`).join("")}</table></div><details><summary>${esc(t(m.entretien_t))}</summary><p>${esc(t(m.entretien))}</p></details>`;

  const f = D.fournitures;
  $("#fournitures").innerHTML = `<h2>${esc(t(f.titre))}</h2><div class="scroll"><table><tr>${f.colonnes.map(c => `<th>${esc(t(c))}</th>`).join("")}</tr>${f.lignes.map(l => `<tr>${l.map(c => `<td>${esc(t(c))}</td>`).join("")}</tr>`).join("")}</table></div>`;

  $("#ouverts").innerHTML = `<h2>${esc(t(D.points_ouverts.titre))}</h2><ul class="pts">${D.points_ouverts.items.map(p => `<li>${esc(t(p))}</li>`).join("")}</ul>`;

  $("#cao").innerHTML = `<h2>${esc(t(D.cao.titre))}</h2><p class="leg">${esc(t(D.cao.note))}</p><pre id="prompt">${esc(D.cao.texte)}</pre><button class="copy" data-src="prompt"></button>`;
});
</script>
</body>
</html>
